<!--
  ============================================================
  SKMS Work Type — 업무 판단 유형 검사 프로토타입 (단일 HTML)
  ------------------------------------------------------------
  화면 흐름
   Intro → 12개 판단의 순간 → 결과 공개(유형 → 4가지 판단 습관 → 회의에서 할 말 → 먼저 묻는 것·강점·한 번 더 생각할 순간
         → 정반대 유형 → 경영자 → 결과 적합도)
       → 다음 챕터: Flip Dilemma(내 선택을 뒤집는 상황) → 선택에 대한 피드백 → 경계 조건(복수 선택)
         → SKMS가 주는 기준(1–5) + 자유서술 → 대화(조건을 다시 흔드는 질문 1–2개)
   결과의 "16개 유형 모두 보기" → 별도 화면(16개 유형 카드 + 유형 상세 + 4개 축 설명)
  코드 구조
   - DEBUG_MODE / PILOT_MODE
   - axes{}        : 4개 판단축과 8개 극(pole)
   - questions[]   : 12문항. 배열 순서 = 표시 순서. 선택지마다 pole을 직접 가진다
   - types{}       : 16개 유형 콘텐츠
   - typeExtras{}  : 유형별 회의에서 할 말(meetingLine), 판단 방식 한 줄(skmsLine)
   - flipDilemmas{} / boundaryConditions{} : 결과 다음 챕터의 딜레마와 경계 조건 선택지
   - typeLeaders{} : 재미 요소. 유형별 유명 경영자 예시
   - conversationPrompts{} : 대화 CTA의 첫 질문 (극별)
   - answers{} / responseMeta{} / feedback{} / session{} : 응답 상태
   - poleStickers{} : 8개 극의 스티커(색, 아이콘)
   - calculateResult() / buildPilotResult() / exportJSON() / exportCSV()
   - renderIntro() / renderQuestion() / renderResult() / renderExplore(code)
   - handleStartConversation() : 향후 SKMS AI(API) 연결 지점
  외부 라이브러리와 외부 요청 없음(서체 내장). 파일을 열면 바로 동작.
  ============================================================
-->

<style>
  /* ---------- 디자인 토큰 ----------
     따뜻한 종이색 캔버스 + 흰 카드. 구조에 쓰는 색은 파랑(--primary) 하나.
     여러 색은 스티커(8개 극의 아이콘)에만 쓴다. */
  :root {
    --canvas: #f6f5f4; --surface: #ffffff;
    --ink: rgba(0,0,0,.95); --ink2: #31302e; --muted: #615d59; --faint: #a39e98;
    --hair: #e6e6e6; --primary: #0075de; --primary-active: #005bab; --night: #213183; --sel: #eaf4fd;
    --sh1: rgba(0,0,0,.01) 0 .175px 1.041px, rgba(0,0,0,.02) 0 .8px 2.925px, rgba(0,0,0,.027) 0 2.025px 7.847px, rgba(0,0,0,.04) 0 4px 18px;
    --sh2: rgba(0,0,0,.01) 0 1px 3px, rgba(0,0,0,.02) 0 3px 7px, rgba(0,0,0,.02) 0 7px 15px, rgba(0,0,0,.04) 0 14px 28px, rgba(0,0,0,.05) 0 23px 52px;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui,
            "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    background: var(--canvas); color: var(--ink);
    font-family: var(--font); font-size: 16px; line-height: 1.5;
    word-break: keep-all; font-feature-settings: "lnum"; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  h1, h2, h3, p { margin: 0; }
  #app { min-height: 100dvh; display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; animation: screen-in .26s ease both; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 20px; }

  /* 버튼 */
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border-radius: 9999px;
    font-size: 16px; font-weight: 600; transition: transform .12s ease, background .12s ease; }
  .btn:active { transform: scale(.95); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover, .btn-primary:active { background: var(--primary-active); }
  .btn-primary[disabled] { opacity: .35; cursor: not-allowed; transform: none; }
  .btn-utility { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 4px 16px; border-radius: 8px;
    border: 1px solid var(--hair); background: var(--surface); font-size: 15px; font-weight: 500; transition: transform .12s ease; }
  .btn-utility:active { transform: scale(.96); }
  .link { color: var(--primary); font-size: 15px; font-weight: 500; min-height: 44px; padding: 0 6px; }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* 스티커: 8개 극마다 하나. 살짝 기울어진 둥근 사각형 + 흰 테두리 */
  .stk { display: inline-grid; place-items: center; width: var(--s, 44px); height: var(--s, 44px); border-radius: 28%;
    background: var(--bg); color: var(--fg); transform: rotate(var(--r, 0deg));
    box-shadow: 0 0 0 calc(var(--s, 44px) * .07) var(--rim, #fff), rgba(0,0,0,.12) 0 3px 8px; flex: none; }
  .stk svg { width: 58%; height: 58%; }
  .stk.flat { box-shadow: none; }
  .stks { display: inline-flex; gap: calc(var(--s, 44px) * .2); }
  @keyframes pop { 0% { transform: scale(0) rotate(0deg); } 70% { transform: scale(1.15) rotate(var(--r, 0deg)); } 100% { transform: scale(1) rotate(var(--r, 0deg)); } }
  .pop .stk { animation: pop .5s cubic-bezier(.3,1.4,.5,1) both; animation-delay: calc(var(--i, 0) * 80ms + 120ms); }

  /* ---------- Intro ---------- */
  .intro { justify-content: center; text-align: center; }
  .intro .wrap { padding-top: 48px; padding-bottom: 64px; }
  .intro-stk { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 8px; max-width: 280px; margin: 0 auto 40px; }
  .intro h1 { font-size: clamp(40px, 10vw, 64px); font-weight: 800; line-height: 1.14; letter-spacing: -0.035em; }
  .intro .lead { margin: 22px auto 0; max-width: 24em; font-size: 18px; line-height: 1.6; color: var(--muted); }
  .intro .btn { margin-top: 36px; width: 100%; max-width: 320px; }
  .intro .note { margin-top: 14px; font-size: 14px; color: var(--faint); }
  .intro .links-row { margin-top: 8px; display: flex; justify-content: center; gap: 8px; }

  /* ---------- Question ---------- */
  .quiz .wrap { display: flex; flex-direction: column; flex: 1; max-width: 860px; padding-top: 12px; padding-bottom: 28px; }
  .qtop { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding-right: 12px; font-size: 15px; color: var(--muted); }
  .back svg { width: 18px; height: 18px; }
  .back[disabled] { visibility: hidden; }
  .q-count { font-size: 14px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .q-count strong { color: var(--ink); font-weight: 700; }
  .progress { height: 6px; border-radius: 6px; background: var(--hair); overflow: hidden; margin-top: 4px; }
  .progress > i { display: block; height: 100%; background: var(--primary); border-radius: 6px; transition: width .4s ease; }
  .q-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px 0 40px; }
  .q-situation { font-size: clamp(24px, 5.2vw, 34px); font-weight: 800; line-height: 1.28; letter-spacing: -0.028em; max-width: 21em; }
  .q-situation span { display: block; }
  .q-situation span + span { color: var(--muted); font-weight: 700; }
  .q-help { margin-top: 10px; font-size: 15px; color: var(--faint); }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
  .option { display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left;

function flipCode(code, axisKeys) {
  return AXIS_ORDER.map((k, i) => {
    if (!axisKeys.includes(k)) return code[i];
    const [p0, p1] = axes[k].poles;
    return code[i] === p0.code ? p1.code : p0.code;
  }).join('');
}

}

  E: '시장 속도와 구성원이 따라갈 수 있는 속도가 다르면, 무엇을 기준으로 맞춰야 할까요?',
  X: '처음 전제가 틀렸다고 판단했을 때, 언제 목표나 방법을 바꿔도 된다고 보세요?',
  F: '환경이 바뀌어도 끝까지 지킬 약속과 다시 정할 약속은 어떻게 나누면 좋을까요?'
};

/* ============================================================
   5. 상태
   answers{}      : questionId → 'A' | 'B'
   responseMeta{} : questionId → { responseTimeMs(A/B 판단 시간), changeCount, reasonTimeMs(이유 선택 시간) }
   reasons{}      : questionId → { choice, reasonId, optionalText } — 선택 이유. 채점에 쓰지 않는다 (v5)
   feedback{}     : 결과 화면에서 받는 응답 (결과 적합도, 추가 딜레마와 이유, 경계 조건, SKMS 기준, 개정 의견, 대화 메모)
   session{}      : 세션 식별자와 시각
   ============================================================ */
let answers, responseMeta, reasons, feedback, session, currentIndex;
let lastResult = null;
let phaseStartedAt = 0; // 문항 화면에서 마지막으로 시간을 끊은 시각. A/B 판단 시간과 이유 선택 시간을 나눠 재는 데 쓴다.

const app = document.getElementById('app');
const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const scrollMode = () => (REDUCE_MOTION ? 'auto' : 'smooth');

function resetState() {
  answers = {};
  responseMeta = {};
  reasons = {}; // v5: questionId → { choice, reasonId, optionalText }. answers{}와 따로 두며 채점에 쓰지 않는다.
  feedback = {
    resultFitScore: null, selectedConflictAxis: null, skmsGuidanceScore: null, guidanceReason: '', conversationNote: '',
    // v4 추가: Flip Dilemma / 경계 조건 / 대화 두 번째 답
    flipDilemmaAxis: null, flipDilemmaOriginalPole: null, flipDilemmaChoice: null, flipDilemmaResponseTimeMs: null,
    boundaryConditions: { AL: [], CR: [], IE: [], XF: [] }, boundaryOtherText: '', conversationNote2: '',
    // v5 추가: 추가 딜레마의 이유 / SKMS 평가의 '잘 모름' / 더 담겼으면 하는 기준 / 의견 정리 시각 / 대화 질문 원문
    flipReasonId: null, flipReasonText: '', flipDilemmaChangeCount: 0,
    skmsGuidanceUnknown: false, skmsClarifyChoice: null, opinionSummarizedAt: null,
    conversationQuestion: '', conversationQuestion2: '', legacyBoundaryConditions: null
  };
  session = { sessionId: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), startedAt: null, completedAt: null };
  currentIndex = 0;
  lastResult = null;
}

/* localStorage가 막혀 있어도 검사는 그대로 동작한다. */
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ schemaVersion: SCHEMA_VERSION, contentVersion: CONTENT_VERSION, answers, responseMeta, reasons, feedback, session, currentIndex })); } catch (e) {}
  if (isFinished()) savePilotRecord();
}
function loadProgress() {
  resetState();
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && saved.answers && saved.session) {
      answers = saved.answers;
      responseMeta = saved.responseMeta || {};
      reasons = saved.reasons || {};
      feedback = Object.assign(feedback, saved.feedback || {});
      feedback.boundaryConditions = Object.assign({ AL: [], CR: [], IE: [], XF: [] }, feedback.boundaryConditions || {});
      session = saved.session;
      currentIndex = Math.min(Math.max(saved.currentIndex || 0, 0), questions.length - 1);
      migrateState(saved.schemaVersion || 4); // schemaVersion이 없는 저장 데이터는 v4
    }
  } catch (e) {}
}
/* 이전 버전 저장 데이터를 지금 구조로 맞춘다. 기존 응답(answers, 채점에 쓰는 값)은 건드리지 않는다. */
function migrateState(from) {
  questions.forEach(q => {
    const a = answers[q.id];
    if (!a) { delete reasons[q.id]; return; }
    const r = reasons[q.id];
    // 이유 기록이 없거나 지금 선택과 다른 선택에 붙어 있으면 빈 값으로 둔다
    if (!r || r.choice !== a) reasons[q.id] = { choice: a, reasonId: null, optionalText: '' };
    else { r.reasonId = r.reasonId || null; r.optionalText = r.optionalText || ''; }
    const m = responseMeta[q.id] || (responseMeta[q.id] = { responseTimeMs: 0, changeCount: 0 });
    if (typeof m.reasonTimeMs !== 'number') m.reasonTimeMs = 0;
  });
  ['guidanceReason', 'conversationNote', 'conversationNote2', 'boundaryOtherText', 'flipReasonText', 'conversationQuestion', 'conversationQuestion2']
    .forEach(k => { if (typeof feedback[k] !== 'string') feedback[k] = ''; });
  if (from < 5) {
    // v4의 경계 조건은 축별 공통 질문이었다. v5는 추가 딜레마의 선택에 따라 질문이 달라지므로,
    // 지금 질문의 선택지에 없는 예전 응답은 legacyBoundaryConditions로 옮겨 보존한다.
    const axis = feedback.flipDilemmaAxis, pole = flipChoicePole();
    if (axis && pole) {
      const valid = boundaryOptionsFor(axis, pole).map(o => o.id).concat(OTHER_ID);
      const cur = feedback.boundaryConditions[axis] || [];
      const dropped = cur.filter(id => !valid.includes(id));
      if (dropped.length) {
        feedback.legacyBoundaryConditions = { [axis]: dropped };
        feedback.boundaryConditions[axis] = cur.filter(id => valid.includes(id));
      }
    }
  }
}
function clearProgress() {
  resetState();
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}
function answeredCount() { return questions.filter(q => answers[q.id]).length; }
function isComplete() { return answeredCount() === questions.length; }
/* 12문항에 모두 답하고 '내 결과 보기'까지 누른 상태. 마지막 문항을 고르기만 한 상태는 아직 완료가 아니다. */
function isFinished() { return isComplete() && !!session.completedAt; }
function metaOf(questionId) {
  const m = responseMeta[questionId] || (responseMeta[questionId] = { responseTimeMs: 0, changeCount: 0, reasonTimeMs: 0 });
  if (typeof m.reasonTimeMs !== 'number') m.reasonTimeMs = 0;
  return m;
}

/* 문항에서 고른 선택지 → 채점되는 극 */
function scoredPole(q) {
  const opt = q.options.find(o => o.key === answers[q.id]);
  return opt ? opt.pole : null;
}

/* 받침 유무에 따라 을/를 선택 */
function josa(word) {
  const c = word.charCodeAt(word.length - 1) - 0xAC00;
  return c >= 0 && c <= 11171 && c % 28 === 0 ? '를' : '을';
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ============================================================
   6. calculateResult() — 채점
   축별 3문항에서 더 많이 고른 극이 우세. 우세한 극의 code 4개를 이어 유형 코드를 만든다.
   화면에는 비율 대신 기울기(약간 / 뚜렷하게)만 보여주고, pct(0/33/67/100)는 DEBUG와 내보내기에만 쓴다.
   "가장 뚜렷한 축"은 자동으로 정하지 않는다. 사용자가 직접 고른 selectedConflictAxis를 쓴다.
   ============================================================ */
function calculateResult() {
  const axisScores = {};
  let typeCode = '';
  AXIS_ORDER.forEach(axisKey => {
    const [p0, p1] = axes[axisKey].poles;
    const qs = questions.filter(q => q.axis === axisKey);
    const counts = { [p0.code]: 0, [p1.code]: 0 };
    qs.forEach(q => { const pole = scoredPole(q); if (pole) counts[pole] += 1; });
    const winner = counts[p0.code] > counts[p1.code] ? p0 : p1;
    const loser = winner === p0 ? p1 : p0;
    axisScores[axisKey] = {
      axisKey, counts, total: qs.length, winner, loser,
      winCount: counts[winner.code],
      pct: { [p0.code]: Math.round(counts[p0.code] / qs.length * 100), [p1.code]: Math.round(counts[p1.code] / qs.length * 100) }
    };
    typeCode += winner.code;
  });
  return { typeCode, axisScores };
}
/* 3문항 기준: 3:0이면 뚜렷하게, 2:1이면 약간 */
function leanText(sc) {
  return `${sc.winner.label} 쪽으로 ${sc.winCount === sc.total ? '뚜렷하게' : '약간'} 기움`;
}

/* 유형 코드 → 축별 우세/반대 극 */
function polesOf(code) {
  return AXIS_ORDER.map((k, i) => {
    const [p0, p1] = axes[k].poles;
    const winner = p0.code === code[i] ? p0 : p1;
    return { axisKey: k, winner, loser: winner === p0 ? p1 : p0 };
  });
}

/* 유형 콘텐츠 조회. types{}에 비어 있는 필드는 axes{} 극 데이터로 조합한다. */
function getTypeContent(code) {
  const t = types[code] || {};
  const ps = polesOf(code);
  const winners = ps.map(p => p.winner);
  const losers = ps.map(p => p.loser);
  return {
    code,
    name: t.name || code,
    tagline: t.tagline || '',
    firstLook: t.firstLook || '',
    strengths: t.strengths || winners.map(p => p.strength),
    blindSpots: t.blindSpots || losers.map(p => p.missed),
    counterpart: t.counterpart ||
      `“${losers[0].ask}” “${losers[1].ask}”라고 묻는 동료가 판단의 질을 높여줄 수 있습니다.`,
    skms: t.skms ||
      `가치가 충돌하는 순간, 당신은 ${winners.map(p => p.skmsValue).join(', ')}을 상대적으로 먼저 판단 기준으로 사용합니다. ` +
      `${losers.map(p => p.skmsValue).join(', ')} 역시 SKMS가 함께 중요하게 보는 가치입니다.`
  };
}

/* counterpart 문장("“…”라고 묻는 동료가 …")에서 따옴표 안의 질문만 꺼낸다 */
function counterpartQuote(text) {
  const m = /^“(.+)”라고 묻는 동료/.exec(text);
  return m ? m[1] : null;
}
/* "이럴 땐 잠깐 멈춰볼 만합니다": 먼저 고르지 않은 극의 watch 문구.
   result가 있으면 더 뚜렷하게 기운 축부터 n개, 없으면 축 순서대로 n개 */
function watchList(code, result, n) {
  let ps = polesOf(code).map((p, i) => ({ text: p.loser.watch, w: result ? result.axisScores[p.axisKey].winCount : 0, i }));
  if (result) ps = ps.sort((a, b) => b.w - a.w || a.i - b.i);
  return ps.slice(0, n).map(p => p.text);
}

/* 8개 극의 스티커: 색과 아이콘. 색은 장식용이며 버튼이나 구조에는 쓰지 않는다. */
const poleStickers = {
  A: { bg: '#62aef0', fg: '#0b2a4a', r: -6, svg: '<path d="M12 3l7 18-7-4-7 4z" fill="currentColor" stroke="none"/>' },
  L: { bg: '#391c57', fg: '#ff8fd8', r: 5,  svg: '<path d="M4 12h16"/><circle cx="5.5" cy="12" r="2.3" fill="currentColor"/><circle cx="12" cy="12" r="2.3" fill="currentColor"/><circle cx="18.5" cy="12" r="2.3" fill="currentColor"/>' },
  C: { bg: '#dd5b00', fg: '#ffffff', r: 4,  svg: '<path d="M13 2 5 14h6l-1 8 9-12h-6z" fill="currentColor" stroke="none"/>' },
  R: { bg: '#523410', fg: '#d6b6f6', r: -5, svg: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>' },
  I: { bg: '#2a9d99', fg: '#ffffff', r: -4, svg: '<path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/>' },
  E: { bg: '#ff64c8', fg: '#ffffff', r: 6,  svg: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>' },
  X: { bg: '#d6b6f6', fg: '#391c57', r: 5,  svg: '<path d="M3 12c3-6 6-6 9 0s6 6 9 0"/>' },
  F: { bg: '#1aae39', fg: '#ffffff', r: -5, svg: '<circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.4l2.7 2.7 4.9-5.6"/>' }
};
/* 극 하나의 스티커. i는 등장 애니메이션 순서 */
function stk(code, i, cls) {
  const p = poleStickers[code];
  return `<span class="stk ${cls || ''}" style="--bg:${p.bg};--fg:${p.fg};--r:${p.r}deg;--i:${i || 0}">` +
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p.svg}</svg></span>`;
}
/* 유형 코드 4글자 → 스티커 4개. 크기는 부모의 --s로 정한다 */
function codeStickers(code) {
  return `<span class="stks" role="img" aria-label="유형 코드 ${code}">${[...code].map((c, i) => stk(c, i)).join('')}</span>`;
}

/* ============================================================
   7. 파일럿 데이터 — 기록 / 내보내기
   buildPilotResult()가 한 세션의 기록(pilotResult) 한 건을 만든다.
   완료된 세션은 이 브라우저의 localStorage(PILOT_KEY)에 쌓이고,
   exportJSON() / exportCSV()로 파일로 내려받는다. SUBMIT_URL이 있으면 완료한 기록을 서버에도 보낸다(sendRecord).
   ============================================================ */
function buildPilotResult() {
  const r = calculateResult();
  return {
    schemaVersion: SCHEMA_VERSION, contentVersion: CONTENT_VERSION,
    sessionId: session.sessionId,
    startedAt: session.startedAt,
    completedAt: session.completedAt,
    typeCode: r.typeCode,
    typeName: (types[r.typeCode] || {}).name || '',
    axisScores: AXIS_ORDER.reduce((o, k) => {
      const sc = r.axisScores[k];
      o[k] = { winner: sc.winner.code, winCount: sc.winCount, counts: sc.counts, pct: sc.pct };
      return o;
    }, {}),
    responses: questions.map((q, i) => ({
      order: i + 1,
      questionId: q.id,
      axis: q.axis,
      choice: answers[q.id] || null,
      scoredPole: scoredPole(q),
      responseTimeMs: (responseMeta[q.id] || {}).responseTimeMs || 0,
      changeCount: (responseMeta[q.id] || {}).changeCount || 0,
      // v5 추가: 선택 이유 (채점과 무관)
      reasonId: (reasons[q.id] || {}).reasonId || null,
      reasonLabel: (reasons[q.id] || {}).reasonId ? reasonLabel(q.id, answers[q.id], reasons[q.id].reasonId) : null,
      reasonText: (reasons[q.id] || {}).reasonId === REASON_OTHER ? (reasons[q.id].optionalText || '') : '',
      reasonTimeMs: (responseMeta[q.id] || {}).reasonTimeMs || 0
    })),
    resultFitScore: feedback.resultFitScore,
    selectedConflictAxis: feedback.selectedConflictAxis,
    skmsGuidanceScore: feedback.skmsGuidanceScore,
    guidanceReason: feedback.guidanceReason,
    conversationNote: feedback.conversationNote,
    // v4 추가 항목
    flipDilemmaAxis: feedback.flipDilemmaAxis,
    flipDilemmaOriginalPole: feedback.flipDilemmaOriginalPole,
    flipDilemmaChoice: feedback.flipDilemmaChoice,
    flipDilemmaChoicePole: flipChoicePole(),
    didSwitchPole: flipChoicePole() ? flipChoicePole() !== feedback.flipDilemmaOriginalPole : null,
    flipDilemmaResponseTimeMs: feedback.flipDilemmaResponseTimeMs,
    boundaryConditions: feedback.boundaryConditions,
    boundaryOtherText: feedback.boundaryOtherText,
    conversationNote2: feedback.conversationNote2,
    // v5 추가 항목: 추가 딜레마의 이유, SKMS 평가의 '잘 모름', 더 담겼으면 하는 기준, 의견 정리 시각
    flipDilemmaChangeCount: feedback.flipDilemmaChangeCount || 0,
    flipReasonId: feedback.flipReasonId,
    flipReasonLabel: flipReasonDisplay(),
    flipReasonText: feedback.flipReasonId === REASON_OTHER ? feedback.flipReasonText : '',
    boundaryQuestionPole: flipChoicePole(),
    skmsGuidanceUnknown: !!feedback.skmsGuidanceUnknown,
    skmsClarifyChoice: feedback.skmsClarifyChoice,
    skmsClarifyLabel: clarifyLabel(),
    opinionSummarizedAt: feedback.opinionSummarizedAt,
    conversationQuestion: feedback.conversationQuestion,
    conversationQuestion2: feedback.conversationQuestion2,
    legacyBoundaryConditions: feedback.legacyBoundaryConditions
  };
}
function flipChoicePole() {
  const a = feedback.flipDilemmaAxis, o = feedback.flipDilemmaOriginalPole, c = feedback.flipDilemmaChoice;
  if (!a || !o || !c) return null;
  const opt = flipDilemmas[a][o].options.find(x => x.key === c);
  return opt ? opt.pole : null;
}
function loadPilotRecords() {
  try { return JSON.parse(localStorage.getItem(PILOT_KEY)) || []; } catch (e) { return []; }
}
/* 서버 전송: 결과를 본 뒤부터, 응답이 바뀔 때마다 잠깐 모았다가 최신 기록 한 건을 보낸다. 실패해도 화면 동작에는 영향이 없다. */
let submitTimer = null;
let lastSentBody = '';
function sendRecord(leaving) {
  if (!SUBMIT_URL || location.protocol === 'file:' || !isFinished()) return;
  let body;
  try { body = JSON.stringify(buildPilotResult()); } catch (e) { return; }
  if (body === lastSentBody) return;
  try {
    if (leaving && navigator.sendBeacon) {
      if (navigator.sendBeacon(SUBMIT_URL, new Blob([body], { type: 'application/json' }))) lastSentBody = body;
      return;
    }
    fetch(SUBMIT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true })
      .then(r => { if (r.ok) lastSentBody = body; }).catch(() => {});
  } catch (e) {}
}
function queueSubmit() {
  if (!SUBMIT_URL) return;
  clearTimeout(submitTimer);
  submitTimer = setTimeout(() => sendRecord(false), 1500);
}
window.addEventListener('pagehide', () => { clearTimeout(submitTimer); sendRecord(true); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { clearTimeout(submitTimer); sendRecord(true); } });

function savePilotRecord() {
  queueSubmit();
  const rec = buildPilotResult();
  const all = loadPilotRecords().filter(r => r.sessionId !== rec.sessionId);
  all.push(rec);
  try { localStorage.setItem(PILOT_KEY, JSON.stringify(all)); } catch (e) {}
}
/* 내보낼 기록: 저장된 기록 + (저장이 막힌 환경을 대비해) 현재 세션 */
function recordsForExport() {
  const all = loadPilotRecords();
  if (isFinished() && !all.some(r => r.sessionId === session.sessionId)) all.push(buildPilotResult());
  return all;
}
function downloadFile(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportJSON() {
  downloadFile(`skms-work-type_${session.sessionId}.json`, JSON.stringify(recordsForExport(), null, 2), 'application/json');
}
/* CSV: 세션 한 건이 한 행. 엑셀에서 한글이 깨지지 않도록 BOM을 붙인다. */
function exportCSV() {
  const head = ['sessionId', 'startedAt', 'completedAt', 'typeCode', 'typeName'];
  AXIS_ORDER.forEach(k => head.push(`${k}_winner`, `${k}_winCount`));
  questions.forEach(q => head.push(`${q.id}_choice`, `${q.id}_scoredPole`, `${q.id}_responseTimeMs`, `${q.id}_changeCount`));
  head.push('resultFitScore', 'selectedConflictAxis', 'skmsGuidanceScore', 'guidanceReason', 'conversationNote');
  head.push('flipDilemmaAxis', 'flipDilemmaOriginalPole', 'flipDilemmaChoice', 'flipDilemmaChoicePole', 'didSwitchPole', 'flipDilemmaResponseTimeMs');
  AXIS_ORDER.forEach(k => head.push(`boundary_${k}`));
  head.push('boundaryOtherText', 'conversationNote2');
  // v5 추가 열: 기존 열의 순서를 바꾸지 않도록 맨 뒤에 붙인다. 예전 기록에는 빈 칸으로 나온다.
  questions.forEach(q => head.push(`${q.id}_reasonId`, `${q.id}_reasonText`, `${q.id}_reasonTimeMs`));
  head.push('flipDilemmaChangeCount', 'flipReasonId', 'flipReasonText', 'boundaryQuestionPole', 'skmsGuidanceUnknown', 'skmsClarifyChoice',
    'opinionSummarizedAt', 'conversationQuestion', 'conversationQuestion2', 'schemaVersion', 'contentVersion');
  const cell = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const rows = recordsForExport().map(r => {
    const row = [r.sessionId, r.startedAt, r.completedAt, r.typeCode, r.typeName];
    AXIS_ORDER.forEach(k => row.push(r.axisScores[k].winner, r.axisScores[k].winCount));
    questions.forEach(q => {
      const x = r.responses.find(o => o.questionId === q.id) || {};
      row.push(x.choice, x.scoredPole, x.responseTimeMs, x.changeCount);
    });
    row.push(r.resultFitScore, r.selectedConflictAxis, r.skmsGuidanceScore, r.guidanceReason, r.conversationNote);
    row.push(r.flipDilemmaAxis, r.flipDilemmaOriginalPole, r.flipDilemmaChoice, r.flipDilemmaChoicePole, r.didSwitchPole, r.flipDilemmaResponseTimeMs);
    AXIS_ORDER.forEach(k => row.push(((r.boundaryConditions || {})[k] || []).join('|')));
    row.push(r.boundaryOtherText, r.conversationNote2);
    questions.forEach(q => {
      const x = r.responses.find(o => o.questionId === q.id) || {};
      row.push(x.reasonId, x.reasonText, x.reasonTimeMs);
    });
    row.push(r.flipDilemmaChangeCount, r.flipReasonId, r.flipReasonText, r.boundaryQuestionPole, r.skmsGuidanceUnknown, r.skmsClarifyChoice,
      r.opinionSummarizedAt, r.conversationQuestion, r.conversationQuestion2, r.schemaVersion, r.contentVersion);
    return row.map(cell).join(',');
  });
  downloadFile(`skms-work-type_${session.sessionId}.csv`, '﻿' + [head.map(cell).join(','), ...rows].join('\r\n'), 'text/csv');
}

function on(id, fn) { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); }

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
/* 선택 목록의 한 줄. single이면 하나만 고르는 목록(aria-pressed), 아니면 여러 개 고르는 목록(role=checkbox). */
function pickHtml(id, label, isOn, single) {
  return `
    <button type="button" class="check ${single ? 'one' : ''}" data-id="${id}" ${single ? `aria-pressed="${!!isOn}"` : `role="checkbox" aria-checked="${!!isOn}"`}>
      <span class="box" aria-hidden="true">${CHECK_SVG}</span>
      <span>${esc(label)}</span>
    </button>`;
}
/* 하나만 고르는 목록: 누르면 선택, 같은 것을 다시 누르면 해제. 화면을 다시 그리지 않고 눌린 상태만 바꾼다.
   opts: { get(), set(id), textEl, otherId, onText(value), after(id) } */
function bindSingleChoice(group, opts) {
  group.querySelectorAll('.check').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.id;
    const next = opts.get() === id ? null : id;
    opts.set(next);
    group.querySelectorAll('.check').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === next)));
    if (opts.textEl) {
      const show = next === opts.otherId;
      opts.textEl.hidden = !show;
      if (!show && opts.textEl.value) { opts.textEl.value = ''; opts.onText(''); }
    }
    saveProgress();
    if (opts.after) opts.after(next);
    if (opts.textEl && next === opts.otherId) opts.textEl.focus();
  }));
  if (opts.textEl) opts.textEl.addEventListener('input', e => {
    opts.onText(e.target.value);
    saveProgress();
    if (opts.after) opts.after(opts.get());
  });
}

/* ============================================================
   9. renderQuestion() — 한 화면에 문항 하나
   이유 버전(ASK_REASON=true): A/B를 고르면 같은 화면 아래에 그 선택에 맞는 이유 영역이 펼쳐진다.
     자동으로 넘어가지 않고 하단 버튼으로 직접 이동한다. 이유는 고르지 않아도 넘어갈 수 있다.
   간단 버전(ASK_REASON=false): 이유를 묻지 않는다. A/B를 고르면 잠깐 뒤 다음 문항으로 넘어간다.
   ============================================================ */
function reasonAreaHtml(q) {
  const key = answers[q.id];
  if (!key) return '';
  const r = reasons[q.id] || { reasonId: null, optionalText: '' };
  const opt = q.options.find(o => o.key === key);
  return `
    <div class="why" role="group" aria-labelledby="whyTitle">
      <h2 id="whyTitle">이 상황에서 이쪽을 고른 가장 큰 이유는?<span class="opt">하나만 · 건너뛰어도 됩니다</span></h2>
      <p class="why-for"><b>${key}</b>${esc(opt.head)}</p>
      <div class="checks" id="whyList">${reasonOptions(q.id, key).map(o => pickHtml(o.id, o.label, r.reasonId === o.id, true)).join('')}</div>
      <input class="field-line" id="whyText" type="text" maxlength="100" autocomplete="off" placeholder="한 줄로 적어주세요 (선택)" aria-label="다른 이유 한 줄 입력 (선택)" value="${esc(r.optionalText || '')}" ${r.reasonId === REASON_OTHER ? '' : 'hidden'}>
    </div>`;
}
function bindReasonArea(q) {
  const list = document.getElementById('whyList');
  if (!list) return;
  const tick = () => { // 이유를 고르거나 적는 데 쓴 시간
    const now = performance.now();
    metaOf(q.id).reasonTimeMs += Math.round(now - phaseStartedAt);
    phaseStartedAt = now;
  };
  bindSingleChoice(list, {
    get: () => reasons[q.id].reasonId,
    set: id => { tick(); reasons[q.id].reasonId = id; },
    textEl: document.getElementById('whyText'),
    otherId: REASON_OTHER,
    onText: v => { tick(); reasons[q.id].optionalText = v; }
  });
}

let autoTimer = null; // 간단 버전(ASK_REASON=false)에서 선택 후 다음 문항으로 넘기는 타이머

function renderQuestion() {
  clearTimeout(autoTimer);
  autoTimer = null;
  const q = questions[currentIndex];
  const total = questions.length;
  const n = currentIndex + 1;
  const isLast = n === total;
  // 현재 위치(n)와 완료 진행률(done)을 구분한다. 지금 보고 있는 문항은 '다음'을 누르기 전까지 완료로 치지 않는다.
  const done = questions.filter((x, i) => i !== currentIndex && answers[x.id]).length;
  const prev = answers[q.id]; // 이전 질문으로 돌아온 경우 이전 선택 표시
  // 진행 상황만 알려준다. 응답에 대한 해석이나 중간 결과는 보여주지 않는다.
  const cheer = isLast ? '마지막 선택입니다' : n === total - 2 ? '거의 다 왔습니다' : n === total / 2 ? '절반 왔습니다' : '';

  app.innerHTML = `
    <main class="screen quiz">
      <div class="wrap">
        <header>
          <div class="qtop">
            <button class="back" id="backBtn" ${currentIndex === 0 ? 'disabled' : ''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>이전
            </button>
            <span class="q-count"><span class="sr-only">현재 위치 </span><strong>${n}</strong> / ${total}${cheer ? ` · ${cheer}` : ''}</span>
          </div>
          <div class="progress" role="progressbar" aria-label="완료한 상황" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}" aria-valuetext="${total}개 중 ${done}개 완료">
            <i style="width:${(done / total) * 100}%"></i>
          </div>
        </header>
        <section class="q-body">
          <div class="q-card">
            <p class="q-label">판단의 순간 <b>${String(n).padStart(2, '0')}</b></p>
            <h1 class="q-situation" id="qTitle" tabindex="-1">${q.situation.map(s => `<span>${esc(s)}</span>`).join('')}</h1>
          </div>
          <p class="q-ask" id="qAsk">나라면?</p>
          <div class="options" id="options" role="group" aria-labelledby="qAsk">${q.options.map(o => `
            <button type="button" class="option ${prev === o.key ? 'selected' : ''}" data-choice="${o.key}" aria-pressed="${prev === o.key}">
              <span class="key"><b>${o.key}</b>${CHECK_SVG}</span>
              <span class="head">${esc(o.head)}</span>
              <span class="detail">${esc(o.detail)}</span>
            </button>`).join('')}</div>
          ${ASK_REASON ? `<div id="reasonArea">${reasonAreaHtml(q)}</div>` : ''}
        </section>
        ${ASK_REASON ? `
        <footer class="q-foot">
          <button type="button" class="btn btn-primary" id="nextBtn" aria-describedby="nextHint" ${prev ? '' : 'disabled'}>${isLast ? '내 결과 보기' : '다음 상황'}</button>
          <p class="q-hint" id="nextHint">${prev ? '이유는 고르지 않아도 넘어갈 수 있어요' : 'A 또는 B를 고르면 넘어갈 수 있어요'}</p>
        </footer>` : ''}
        <p class="sr-only" role="status" aria-live="polite" id="qLive"></p>
      </div>
    </main>`;

  on('backBtn', () => { if (currentIndex > 0) moveQuestion(-1); });
  on('nextBtn', () => moveQuestion(1));
  document.querySelectorAll('#options .option').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(q, btn.dataset.choice));
  });
  bindReasonArea(q);
  phaseStartedAt = performance.now();
  window.scrollTo(0, 0);
}

/* A/B 선택. 화면 전체를 다시 그리지 않고 선택 상태와 이유 영역만 바꾼다. */
function selectAnswer(q, choice) {
  if (autoTimer) return; // 간단 버전: 넘어가는 중에는 다시 누를 수 없다
  const changed = answers[q.id] !== choice;
  if (ASK_REASON && !changed) return; // 같은 선택지를 다시 눌러도 시간이나 변경 횟수를 더하지 않는다
  if (changed) {
    // 파일럿 지표: A/B를 판단하는 데 쓴 시간(다시 돌아와 바꾼 시간 포함)과 응답을 바꾼 횟수
    const now = performance.now();
    const meta = metaOf(q.id);
    meta.responseTimeMs += Math.round(now - phaseStartedAt);
    phaseStartedAt = now; // 여기서부터는 이유 선택 시간
    if (answers[q.id]) meta.changeCount += 1;
    answers[q.id] = choice;
    reasons[q.id] = { choice, reasonId: null, optionalText: '' }; // A/B를 바꾸면 이전 분기의 이유와 입력은 지운다
    saveProgress();
  }

  document.querySelectorAll('#options .option').forEach(el => {
    const isOn = el.dataset.choice === choice;
    el.classList.toggle('selected', isOn);
    el.setAttribute('aria-pressed', String(isOn));
  });
  const head = q.options.find(o => o.key === choice).head;

  if (!ASK_REASON) {
    // 간단 버전: 이유를 묻지 않고, 고르면 잠깐 뒤 다음 문항(마지막이면 결과)으로 넘어간다
    document.getElementById('options').classList.add('locked');
    document.getElementById('qLive').textContent = `${choice} ‘${head}’ 선택됨.`;
    autoTimer = setTimeout(() => { autoTimer = null; moveQuestion(1); }, AUTO_ADVANCE_MS);
    return;
  }

  const area = document.getElementById('reasonArea');
  area.innerHTML = reasonAreaHtml(q);
  bindReasonArea(q);
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('nextHint').textContent = '이유는 고르지 않아도 넘어갈 수 있어요';
  document.getElementById('qLive').textContent = `${choice} ‘${head}’ 선택됨. 아래에서 이유를 고를 수 있어요. 건너뛰어도 됩니다.`;
  area.scrollIntoView({ block: 'nearest', behavior: scrollMode() });
}

/* 이전 / 다음 문항으로 이동. 마지막 문항에서 다음을 누르면 결과로 간다. */
function moveQuestion(step) {
  const q = questions[currentIndex];
  if (step > 0 && !answers[q.id]) return;
  if (ASK_REASON && answers[q.id]) { // A/B를 고른 뒤 이 화면에 머문 시간은 이유 선택 시간으로 본다
    metaOf(q.id).reasonTimeMs += Math.round(performance.now() - phaseStartedAt);
    phaseStartedAt = performance.now();
  }
  if (step > 0 && currentIndex === questions.length - 1) {
    if (!session.completedAt) session.completedAt = new Date().toISOString();
    saveProgress();
    renderResult();
    return;
  }
  currentIndex += step;
  saveProgress();
  renderQuestion();
  const title = document.getElementById('qTitle');
  if (title) title.focus({ preventScroll: true }); // 키보드·스크린리더 사용자가 새 문항에서 이어가도록
}

/* ============================================================
   10. renderResult() — 결과 공개
   순서(기존과 동일): Hero(유형·한 줄·4개 판단 기준) → 4가지 판단 습관 → 회의에서 할 말
        → 가장 먼저 묻는 것(강점 3, 한 번 더 생각할 순간 3, '자세히 보기'로 접힌 네 가지 판단 습관 설명) → 정반대 유형 → 경영자 → 16개 유형
        → 다음 챕터(chapterHtml): 추가 딜레마 → 이유 → 경계 조건 → SKMS 기준 → 의견 정리 → (선택) 대화
   결과 적합도 질문과 '자세히 보기' 접힘 영역은 화면에서 뺐다 (resultFitScore 필드는 기록 호환을 위해 남겨 둔다).
   결과 상세를 읽지 않아도 다음 챕터에 참여할 수 있다. SKMS는 경계 조건을 고른 뒤에 처음 등장한다.
   ============================================================ */
/* 네 가지 판단축 설명 카드. mark(polesOf 결과)가 있으면 해당 극에 markLabel 배지를 붙인다. 결과 화면과 유형 탐색 화면이 함께 쓴다. */
function axisGuideCards(mark, markLabel) {
  return AXIS_ORDER.map((k, i) => {
    const axis = axes[k];
    const poleHtml = pole => {
      const isOn = mark && mark[i].winner === pole;
      return `
        <div class="pole ${isOn ? 'on' : ''}">
          <div class="pole-head">${stk(pole.code, 0, 'flat')}<span>${pole.tagLong || pole.tag}<small>${pole.label}</small></span>${isOn ? `<span class="badge">${markLabel}</span>` : ''}</div>
          <p>${esc(pole.desc)}</p>
        </div>`;
    };
    return `
      <div class="card ax-card">
        <h3>${axisTagLabel(k)}</h3>
        <p class="q">${esc(axis.question)}</p>
        <div class="poles">${poleHtml(axis.poles[0])}${poleHtml(axis.poles[1])}</div>
      </div>`;
  }).join('');
}

        </section>

        ${x.meetingLine ? `

        <section class="sec">

          </div>
        </section>

        ${typeLeaders[code] ? `
        <section class="sec">
          <h2>비슷한 판단 스타일로 떠오르는 경영자</h2>
          <div class="card">${leaderHtml(code)}</div>
        </section>` : ''}

        <div class="center-row explore-row"><button class="btn-utility" id="exploreBtn">16개 유형 모두 보기</button></div>
      </div></div>

      <section class="chapter" id="chapter"><div class="wrap">${chapterHtml(result)}</div></section>

      <div class="body"><div class="wrap">
        ${PILOT_MODE ? `
        <section class="card export">
          <h2>응답 내보내기</h2>
          <p>응답은 익명으로 수집되며, 이 기기에 저장된 기록을 파일로도 받을 수 있습니다. 이름이나 소속은 기록되지 않습니다.</p>
          <div class="row">
            <button class="btn-utility" id="exportJsonBtn">JSON으로 저장</button>
            <button class="btn-utility" id="exportCsvBtn">CSV로 저장</button>
          </div>
        </section>` : ''}
        <div class="foot"><button class="link" id="retryBtn">처음부터 다시 해보기</button></div>
        ${DEBUG_MODE ? renderDebug(result) : ''}
      </div></div>
    </main>`;

  // 판단 습관의 스티커를 가운데에서 제자리로 옮긴다
  requestAnimationFrame(() => requestAnimationFrame(() => {
    app.querySelectorAll('.spec-line').forEach(el => el.style.setProperty('--p', el.dataset.p));
  }));

  bindScales(app);
  bindChapter(result);
  app.querySelectorAll('.partner').forEach(btn => btn.addEventListener('click', () => renderExplore(btn.dataset.type)));
  on('exportJsonBtn', exportJSON);
  on('exportCsvBtn', exportCSV);
  on('exploreBtn', () => renderExplore());
  on('retryBtn', () => { clearProgress(); renderIntro(); });
  window.scrollTo(0, 0);
}

/* 1–5 척도 */
function scaleHtml(field, low, high, labelId) {
  return `
    <div class="scale" data-field="${field}" role="group" ${labelId ? `aria-labelledby="${labelId}"` : ''}>
      ${[1, 2, 3, 4, 5].map(n => `<button type="button" class="scale-btn" data-value="${n}" aria-label="${n}점${n === 1 ? ` (${low})` : n === 5 ? ` (${high})` : ''}" aria-pressed="${feedback[field] === n}">${n}</button>`).join('')}
    </div>
    <div class="scale-ends" aria-hidden="true"><span>${low}</span><span>${high}</span></div>`;
}
/* 다시 그리지 않고 눌린 상태만 바꾼다 */
function bindScales(root) {
  root.querySelectorAll('.scale').forEach(group => {
    if (group.dataset.bound) return;
    group.dataset.bound = '1';
    group.querySelectorAll('.scale-btn').forEach(btn => btn.addEventListener('click', () => {
      feedback[group.dataset.field] = Number(btn.dataset.value);
      group.querySelectorAll('.scale-btn').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      saveProgress();
    }));
  });
}

/* ============================================================
   10-2. 결과 다음 챕터: 추가 딜레마 → 선택 이유 → 경계 조건 → SKMS 기준 → 의견 정리 → (선택) 대화
   상황 → 선택 → 이유 → 경계 → SKMS 순서. 앞 단계에 답해야 다음 단계가 나타난다.
   선택하기 전에는 어떤 축인지, 무엇을 보려는 것인지 알려주지 않는다.
   여기서 받는 응답은 모두 최초 12문항의 유형 점수에 반영하지 않는다.
   ============================================================ */
let flipShownAt = 0;    // 딜레마 카드가 화면에 들어온 시각
let flipRenderedAt = 0; // 화면을 그린 시각 (위 값을 못 잡았을 때의 대비)

/* SKMS 영역 첫 카드: 방금 판단한 상황 / 선택한 행동 / 선택 이유 / 판단을 달리할 조건 */
function recapHtml(fx) {
  const opt = fx.d.options.find(o => o.key === feedback.flipDilemmaChoice);
  const reason = flipReasonDisplay();
  const conds = boundaryLabels(fx.axis);
  return `
    <div><dt>방금 판단한 상황</dt><dd>${esc(fx.d.situation.join(' '))}</dd></div>
    <div><dt>선택한 행동</dt><dd><b>${esc(opt ? opt.head : '')}</b></dd></div>
    <div><dt>선택 이유</dt><dd class="${reason ? '' : 'none'}">${esc(reason || '고르지 않음')}</dd></div>
    <div><dt>판단을 달리할 조건</dt><dd><ul class="picked" id="pickedList">${conds.map(l => `<li>${esc(l)}</li>`).join('')}</ul></dd></div>`;
}
/* 의견 정리 카드. 서버로 보내는 것이 없으므로 '제출'이나 '반영'이라고 쓰지 않는다. */
function finishHtml(fx) {
  if (!feedback.opinionSummarizedAt) return `
    <h3 class="finish-h">여기까지의 내 의견을 정리해볼까요?</h3>
    <p class="finish-p">고른 행동과 이유, 조건, 바라는 기준을 한 번에 모아 봅니다. 긴 대화 없이 여기서 마칠 수 있어요.</p>
    <div class="acts"><button type="button" class="btn btn-primary" id="summarizeBtn">내 의견 정리하기</button></div>`;
  const opt = fx.d.options.find(o => o.key === feedback.flipDilemmaChoice);
  const reason = flipReasonDisplay();
  const conds = boundaryLabels(fx.axis);
  const clarify = clarifyLabel();
  const free = feedback.guidanceReason.trim();
  return `
    <p class="done-note" id="doneNote" tabindex="-1"><span class="done-ic" aria-hidden="true">${CHECK_SVG}</span>내 의견을 정리했어요.</p>
    <dl class="recap">
      <div><dt>내가 고른 행동과 이유</dt><dd><b>${esc(opt ? opt.head : '')}</b>${reason ? `<br>${esc(reason)}` : '<br><span class="none">이유는 고르지 않음</span>'}</dd></div>
      <div><dt>선택한 경계 조건</dt><dd>${conds.length ? `<ul class="picked">${conds.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : '<span class="none">고르지 않음</span>'}</dd></div>
      <div><dt>더 명확해지길 바라는 SKMS 기준</dt><dd>${clarify ? esc(clarify) : '<span class="none">고르지 않음</span>'}${free ? `<br>${esc(free)}` : ''}</dd></div>
    </dl>
    <p class="note-sm">응답은 이름·소속 없이 익명으로 저장되어 SKMS 개정 논의에 참고됩니다. 위 응답을 고치면 이 정리도 함께 바뀝니다.</p>`;
}
/* 응답이 바뀌었을 때 요약 카드들만 다시 그린다 (입력 중인 칸은 건드리지 않는다). */
function refreshDerived(result) {
  const fx = flipState(result);
  const recap = document.getElementById('recap');
  if (recap) recap.innerHTML = recapHtml(fx);
  const fin = document.getElementById('finishCard');
  if (fin && feedback.opinionSummarizedAt) fin.innerHTML = finishHtml(fx);
}

function chapterHtml(result) {
  const fx = flipState(result);
  const { axis, d } = fx;
  const answered = !!fx.chosenPole;
  const picked = feedback.boundaryConditions[axis] || [];
  const hasBoundary = picked.length > 0;

  let fbHtml = '';
  if (answered) {
    // 원래 축의 다수 선택과, 조건이 다른 새로운 상황에서의 선택을 비교한다.
    // 같은 질문의 답이 바뀐 것처럼, 또는 유형이 틀렸거나 답이 모순된 것처럼 말하지 않는다.
    const before = poleCopy[fx.orig].pick;

        <p>조건이 다른 새로운 상황에서의 선택이에요. 어느 쪽이 더 옳다는 뜻은 아닙니다.</p>

  const condOptions = answered ? boundaryOptionsFor(axis, fx.chosenPole) : [];

    <p class="ch-label">한 번만 더</p>
    <h2 class="ch-title" id="chTitle" tabindex="-1">이런 상황이면 어떻게 할까요?</h2>
    <div class="q-card flip-card" id="flipCard">
      <h3 class="q-situation">${d.situation.map(x => `<span>${esc(x)}</span>`).join('')}</h3>
    </div>
    <p class="q-ask" id="flipAsk">나라면?</p>
    <div class="options" id="flipOptions" role="group" aria-labelledby="flipAsk">${d.options.map(o => `
      <button type="button" class="option ${feedback.flipDilemmaChoice === o.key ? 'selected' : ''}" data-choice="${o.key}" aria-pressed="${feedback.flipDilemmaChoice === o.key}">
        <span class="key"><b>${o.key}</b>${CHECK_SVG}</span>
        <span class="head">${esc(o.head)}</span>
      </button>`).join('')}</div>
    <p class="sr-only" role="status" aria-live="polite" id="chLive"></p>

    ${answered ? `
    ${fbHtml}

    <div class="ch-block">
      <div class="card ask">
        <h3 id="flipWhyTitle">${esc(flipReasonQuestion[fx.chosenPole])}<span class="opt">하나만 · 건너뛰어도 됩니다</span></h3>
        <div class="checks" id="flipWhy" role="group" aria-labelledby="flipWhyTitle">
          ${flipReasonOptions(axis, fx.orig, fx.chosenPole).map(o => pickHtml(o.id, o.label, feedback.flipReasonId === o.id, true)).join('')}
        </div>
        <input class="field-line" id="flipWhyText" type="text" maxlength="100" autocomplete="off" placeholder="한 줄로 적어주세요 (선택)" aria-label="다른 이유 한 줄 입력 (선택)" value="${esc(feedback.flipReasonText)}" ${feedback.flipReasonId === REASON_OTHER ? '' : 'hidden'}>
      </div>
    </div>

    <div class="ch-block">
      <h2 class="ch-title sm">그럼, 기준을 어디에 둘까요?</h2>
      <p class="ch-sub">결국 중요한 건 어느 순간에 어느 쪽을 고르느냐입니다.</p>
      <div class="card ask">
        <h3 id="condTitle">${esc(conditionQuestion[fx.chosenPole])}<span class="opt">여러 개 선택</span></h3>
        <p class="ch-sub">판단을 바꿀 때 고려할 조건이에요. 하나만 충족되면 반드시 바꾼다는 뜻은 아니에요.</p><div class="checks" id="boundaryChecks" role="group" aria-labelledby="condTitle">
          ${condOptions.map(o => pickHtml(o.id, o.label, picked.includes(o.id))).join('')}
          ${pickHtml(OTHER_ID, '기타', picked.includes(OTHER_ID))}
          <p class="checks-sep">고르기 어렵다면</p>
          ${condCommon.map(o => pickHtml(o.id, o.label, picked.includes(o.id))).join('')}
        </div>
        <textarea class="field other-field" id="otherInput" placeholder="다른 기준이 있다면 적어주세요. (선택)" aria-label="기타 조건 (선택)" ${picked.includes(OTHER_ID) ? '' : 'hidden'}>${esc(feedback.boundaryOtherText)}</textarea>

    <div class="ch-block" id="skmsBlock" ${hasBoundary ? '' : 'hidden'}>

        <p class="note-sm">이 서비스의 기획 관점을 풀어 쓴 문장이며, SKMS 원문을 인용한 것이 아닙니다.</p>
      </div>
      <div class="card ask">

        <button type="button" class="check one unknown" id="guideUnknown" aria-pressed="${!!feedback.skmsGuidanceUnknown}">
          <span class="box" aria-hidden="true">${CHECK_SVG}</span>
          <span>SKMS 내용을 잘 몰라 판단하기 어렵다</span>
        </button>
        <div class="reason">
          <h4 class="sub-q" id="clarifyTitle">SKMS에 더 명확히 담겼으면 하는 것은?<span class="opt">하나만 · 선택</span></h4>
          <div class="checks" id="clarifyList" role="group" aria-labelledby="clarifyTitle">
            ${clarifyOpts.map(o => pickHtml(o.id, o.label, feedback.skmsClarifyChoice === o.id, true)).join('')}
          </div>
        </div>
        <div class="reason">
          <label for="reasonInput">SKMS에 어떤 기준이 더 있으면 좋을까요?<span class="opt">선택</span></label>
          <textarea class="field" id="reasonInput" placeholder="예: 어떤 결정은 먼저 맞추고, 어떤 결정은 현장에서 판단해도 되는지.">${esc(feedback.guidanceReason)}</textarea>
        </div>
      </div>

      <div class="card finish" id="finishCard">${finishHtml(fx)}</div>

      <div class="card kw" id="ctaCard">${ctaCardHtml(result)}</div>
    </div>` : ''}`;
}

/* 대화 카드(선택). 기본은 추가 딜레마에서 고민한 축, 원하면 다른 축으로 바꿀 수 있다(selectedConflictAxis). */
function conversationAxis() { return feedback.selectedConflictAxis || feedback.flipDilemmaAxis; }
function ctaCardHtml(result) {
  const k = conversationAxis();
  const [p0, p1] = axes[k].poles;
  return `
    <span class="stks">${stk(p0.code)}${stk(p1.code)}</span>
    <p class="kw-label">더 이야기하고 싶다면 <span class="opt">선택</span></p>
    <p class="kw-name">${p0.tag} ↔<br>${p1.tagLong || p1.tag}</p>
    <p class="kw-line">방금 고른 기준을 가지고 비슷한 상황을 하나 더 생각해봅니다. 하지 않아도 됩니다.</p>
    <div class="acts"><button type="button" class="btn-utility" id="ctaBtn">이어서 이야기하기 →</button></div>
    <div class="other-axis">
      <span>다른 상황으로 이야기하기</span>
      ${AXIS_ORDER.filter(a => a !== k).map(a => `<button class="chip-btn" data-axis="${a}">${axes[a].poles[0].tag} ↔ ${axes[a].poles[1].tag}</button>`).join('')}
    </div>`;
}

function bindChapter(result) {
  const chapter = document.getElementById('chapter');
  const wrap = chapter.querySelector('.wrap');
  const fx = flipState(result);
  const axis = fx.axis;
  const say = msg => { const live = document.getElementById('chLive'); if (live) live.textContent = msg; };

  // 응답 시간: 딜레마 카드가 화면에 들어온 순간부터 잰다
  flipShownAt = 0;
  flipRenderedAt = performance.now();
  const card = document.getElementById('flipCard');
  if (card && 'IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { if (!flipShownAt) flipShownAt = performance.now(); io.disconnect(); } }, { threshold: 0.6 });
    io.observe(card);
  } else { flipShownAt = performance.now(); }

  wrap.querySelectorAll('#flipOptions .option').forEach(btn => btn.addEventListener('click', () => {
    const choice = btn.dataset.choice;
    if (feedback.flipDilemmaChoice === choice) return; // 같은 선택지를 다시 눌러도 아무것도 바꾸지 않는다
    const first = !feedback.flipDilemmaChoice;
    if (first) feedback.flipDilemmaResponseTimeMs = Math.round(performance.now() - (flipShownAt || flipRenderedAt));
    else { // 선택을 바꾸면 이전 선택에 딸린 이유·조건·평가가 남지 않게 비운다
      feedback.flipDilemmaChangeCount = (feedback.flipDilemmaChangeCount || 0) + 1;
      resetFlipDependents(axis);
    }
    feedback.flipDilemmaChoice = choice;
    saveProgress();
    const y = window.scrollY;
    wrap.innerHTML = chapterHtml(result); // 답에 맞는 다음 단계를 그린다
    bindChapter(result);
    window.scrollTo(0, y);
    const again = wrap.querySelector(`#flipOptions .option[data-choice="${choice}"]`);
    if (again) again.focus({ preventScroll: true }); // 다시 그려도 키보드 위치를 잃지 않게
    const fb = wrap.querySelector('.flip-fb');
    const live = document.getElementById('chLive');
    if (fb && live) live.textContent = `${fb.querySelector('.fb-head').textContent} 아래에 이유와 조건을 묻는 질문이 나타났어요.`;
    if (first && fb) fb.scrollIntoView({ behavior: scrollMode(), block: 'center' });
  }));

  bindScales(wrap);

  const why = document.getElementById('flipWhy');
  if (why) bindSingleChoice(why, {
    get: () => feedback.flipReasonId,
    set: id => { feedback.flipReasonId = id; },
    textEl: document.getElementById('flipWhyText'),
    otherId: REASON_OTHER,
    onText: v => { feedback.flipReasonText = v; },
    after: () => refreshDerived(result)
  });

  const checks = document.getElementById('boundaryChecks');
  if (checks) {
    const other = document.getElementById('otherInput');
    const block = document.getElementById('skmsBlock');
    const sync = () => {
      const picked = feedback.boundaryConditions[axis];
      checks.querySelectorAll('.check').forEach(b => b.setAttribute('aria-checked', String(picked.includes(b.dataset.id))));
      other.hidden = !picked.includes(OTHER_ID);
      const wasHidden = block.hidden;
      block.hidden = picked.length === 0;
      if (wasHidden && !block.hidden) say('아래에 SKMS 기준에 대한 질문이 나타났어요.');
      refreshDerived(result);
    };
    checks.querySelectorAll('.check').forEach(btn => btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      let picked = feedback.boundaryConditions[axis] || [];
      const turnOn = !picked.includes(id);
      if (!turnOn) picked = picked.filter(x => x !== id);
      // '아직 고르기 어렵다'는 다른 선택과 함께 둘 수 없고, '제시된 조건 중에는 없다'는 기타와만 함께 둘 수 있다
      else if (id === COND_UNSURE) picked = [COND_UNSURE];
      else if (id === COND_NONE) picked = picked.filter(x => x === OTHER_ID).concat(COND_NONE);
      else if (id === OTHER_ID) picked = picked.filter(x => x !== COND_UNSURE).concat(OTHER_ID);
      else picked = picked.filter(x => x !== COND_UNSURE && x !== COND_NONE).concat(id);
      feedback.boundaryConditions[axis] = picked;
      if (!picked.includes(OTHER_ID) && feedback.boundaryOtherText) { feedback.boundaryOtherText = ''; other.value = ''; }
      saveProgress();
      sync();
      if (id === OTHER_ID && turnOn) other.focus();
    }));
    other.addEventListener('input', e => { feedback.boundaryOtherText = e.target.value; saveProgress(); refreshDerived(result); });
  }

  // SKMS 평가: 숫자 척도와 '잘 몰라 판단하기 어렵다'는 서로 다른 응답이다. 후자를 점수로 바꾸지 않는다.
  const unknown = document.getElementById('guideUnknown');
  const guideScale = wrap.querySelector('.scale[data-field="skmsGuidanceScore"]');
  if (unknown && guideScale) {
    unknown.addEventListener('click', () => {
      feedback.skmsGuidanceUnknown = !feedback.skmsGuidanceUnknown;
      unknown.setAttribute('aria-pressed', String(feedback.skmsGuidanceUnknown));
      if (feedback.skmsGuidanceUnknown) {
        feedback.skmsGuidanceScore = null;
        guideScale.querySelectorAll('.scale-btn').forEach(b => b.setAttribute('aria-pressed', 'false'));
      }
      saveProgress();
    });
    guideScale.addEventListener('click', e => {
      if (!e.target.closest('.scale-btn') || !feedback.skmsGuidanceUnknown) return;
      feedback.skmsGuidanceUnknown = false;
      unknown.setAttribute('aria-pressed', 'false');
      saveProgress();
    });
  }
  const clarify = document.getElementById('clarifyList');
  if (clarify) bindSingleChoice(clarify, {
    get: () => feedback.skmsClarifyChoice,
    set: id => { feedback.skmsClarifyChoice = id; },
    after: () => refreshDerived(result)
  });

  const reason = document.getElementById('reasonInput');
  if (reason) reason.addEventListener('input', e => { feedback.guidanceReason = e.target.value; saveProgress(); refreshDerived(result); });

  // 참여 완료 지점: 대화 없이 여기서 마칠 수 있다
  const fin = document.getElementById('finishCard');
  if (fin) fin.addEventListener('click', e => {
    if (!e.target.closest('#summarizeBtn')) return;
    feedback.opinionSummarizedAt = new Date().toISOString();
    saveProgress();
    fin.innerHTML = finishHtml(flipState(result));
    say('내 의견을 정리했어요.');
    const note = document.getElementById('doneNote');
    if (note) note.focus({ preventScroll: true });
    fin.scrollIntoView({ behavior: scrollMode(), block: 'nearest' });
  });

  const ctaCard = document.getElementById('ctaCard');
  if (ctaCard) ctaCard.addEventListener('click', e => {
    if (e.target.closest('#ctaBtn')) { handleStartConversation(lastResult); return; }
    const chip = e.target.closest('.chip-btn');
    if (chip) {
      // 다른 축을 고르면 selectedConflictAxis에 남긴다. Flip 축으로 돌아오면 비운다.
      feedback.selectedConflictAxis = chip.dataset.axis === feedback.flipDilemmaAxis ? null : chip.dataset.axis;
      saveProgress();
      ctaCard.innerHTML = ctaCardHtml(result);
    }
  });
}

/* ============================================================
   12. handleStartConversation() — 대화 CTA
   기준 축은 사용자가 직접 고른 selectedConflictAxis.
   현재: 그 축에서 사용자가 먼저 사용한 극에 맞는 질문을 modal로 보여주고, 적은 내용을 기록에 저장한다.
   향후: 이 함수에서 SKMS AI(Agent) API를 호출하면 된다. context가 Agent에 넘길 payload 초안이다.
   ============================================================ */
function buildConversationContext(result) {
  const axisKey = conversationAxis();
  const pole = result.axisScores[axisKey].winner;
  const onFlipAxis = axisKey === feedback.flipDilemmaAxis;
  // probe가 있는 조건만 대화 질문으로 쓴다 ('아직 고르기 어렵다' 등은 축의 기본 질문으로 넘어간다)
  const picked = onFlipAxis ? allBoundaryOptions(axisKey).filter(o => feedback.boundaryConditions[axisKey].includes(o.id)) : [];
  // 첫 질문: 고른 경계 조건이 있으면 그 조건을 다시 흔드는 질문, 없으면 축의 기본 질문
  const opening = picked.length
    ? { lead: '아까 고른 기준', question: picked[0].probe }
    : { lead: `${axisTagLabel(axisKey)}에서 내가 먼저 본 것: ${pole.tag}`, question: conversationPrompts[pole.code] };
  // 두 번째 질문: 조건을 하나 더 골랐으면 그 조건을, 아니면 축의 기본 질문
  const followUp = picked.length > 1 ? picked[1].probe : (picked.length ? conversationPrompts[pole.code] : null);
  return Object.assign(buildPilotResult(), {
    conversationAxis: axisKey, conversationPole: pole.code,
    boundaryLabels: onFlipAxis ? boundaryLabels(axisKey) : [],
    // v5: 12문항의 선택 이유와, 추가 딜레마에서 정리한 개정 의견도 함께 넘긴다 (유형 점수와는 분리된 응답)
    questionReasons: questions.filter(q => (reasons[q.id] || {}).reasonId).map(q => ({
      questionId: q.id, axis: q.axis, choice: answers[q.id],
      reason: reasonLabel(q.id, answers[q.id], reasons[q.id].reasonId), reasonText: reasons[q.id].optionalText || '' })),
    revisionOpinion: {
      axis: feedback.flipDilemmaAxis,
      situation: flipDilemmas[feedback.flipDilemmaAxis][feedback.flipDilemmaOriginalPole].situation.join(' '),
      action: (flipDilemmas[feedback.flipDilemmaAxis][feedback.flipDilemmaOriginalPole].options.find(o => o.key === feedback.flipDilemmaChoice) || {}).head || null,
      reason: flipReasonDisplay(),
      conditions: boundaryLabels(feedback.flipDilemmaAxis),
      skmsGuidanceScore: feedback.skmsGuidanceScore, skmsGuidanceUnknown: !!feedback.skmsGuidanceUnknown,
      wantsClearer: clarifyLabel(), freeText: feedback.guidanceReason
    },
    openingLead: opening.lead, openingQuestion: opening.question, followUpQuestion: followUp
  });
}

function handleStartConversation(result) {
  if (!result || !conversationAxis()) return;
  const context = buildConversationContext(result);

  // TODO(API): 여기서 context를 SKMS AI로 전달하고 대화 화면으로 전환한다.
  // context에는 유형 결과, 문항별 선택 이유, 추가 딜레마 응답과 이유, 경계 조건, 개정 의견, 자유서술이 모두 들어 있다.
  // 예) fetch('/api/skms-agent/start', { method: 'POST', body: JSON.stringify(context) })
  if (DEBUG_MODE) console.log('[handleStartConversation] context', context);

  const step = n => {
    const isFirst = n === 1;
    const hasNext = isFirst && !!context.followUpQuestion;
    const field = isFirst ? 'conversationNote' : 'conversationNote2';
    openModal(`
      <p class="m-lead">${esc(isFirst ? context.openingLead : '하나만 더')}</p>
      <p class="m-q" id="modalTitle">${esc(isFirst ? context.openingQuestion : context.followUpQuestion)}</p>
      <textarea class="field" id="noteInput" placeholder="내 생각을 적어주세요." aria-label="내 생각">${esc(feedback[field])}</textarea>
      <p class="m-note">SKMS AI와의 대화는 아직 연결되어 있지 않습니다. 적은 내용은 다른 응답과 함께 익명으로 저장됩니다.</p>
      <div class="m-actions">${hasNext ? '<button class="btn btn-primary" id="nextQ">다음 질문 →</button>' : '<button class="btn btn-primary" data-close>저장하고 닫기</button>'}</div>`);
    document.getElementById('noteInput').addEventListener('input', e => {
      feedback[field] = e.target.value;
      // 어떤 질문에 대한 답인지 함께 남긴다 (나중에 조건을 바꿔 질문이 달라져도 답이 엉뚱한 질문에 붙지 않게)
      feedback[isFirst ? 'conversationQuestion' : 'conversationQuestion2'] = isFirst ? context.openingQuestion : context.followUpQuestion;
      saveProgress();
    });
    on('nextQ', () => step(2));
  };
  step(1);
}

/* Modal 유틸 */
function openModal(html) {
  closeModal();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modalBackdrop';
  backdrop.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${html}</div>`;
  backdrop.addEventListener('click', e => {
    if (e.target === backdrop || e.target.closest('[data-close]')) closeModal();
  });
  document.body.appendChild(backdrop);
  const ta = backdrop.querySelector('textarea');
  if (ta) ta.focus();
}
function closeModal() {
  const el = document.getElementById('modalBackdrop');
  if (el) el.remove();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const RESEARCH_NOTES = "<h1>이유·판단 경계 선택지 검토</h1><p>문항 버전: reasons-theory-20261007-v1 · 2026-10-07</p><p><b>이론을 참고해 재작성한 탐색용 문항이며 검증된 척도나 원문 문항의 번역이 아닙니다.</b> 이론 연결은 설계자의 해석입니다. 선택지의 실제 빈도·대표성·타당성은 아직 확인하지 않았습니다.</p><p>이유는 현재 선택을 설명하는 자기보고, 경계는 반대 선택을 고려할 가상 조건입니다. 단일 이유 응답으로 실제 인과원인이나 판단의 임계점을 확정하지 않습니다. 이론들은 개인·팀·조직 등 분석 수준이 다르며 이 검사로 각 이론을 측정하지 않습니다.</p><p>각 분기의 이유 3개와 다른 이유·모르겠음, 건너뛰기를 유지했습니다. 이유와 조건은 유형 점수에 반영하지 않습니다. 일반 응답 화면에는 이론명을 보여주지 않습니다.</p><h2>설계상 남은 제한</h2><ul><li>Q8의 단일 평가기준 강제선택은 균형성과표의 처방이 아닙니다.</li><li>Q9는 역량 전략을 물으므로 ‘내부 선택=구성원 행복 선호’로 해석하지 않습니다.</li><li>Q12는 핵심 가정이 틀렸다고 명시해 전환 쪽이 유리할 수 있습니다. 이유 수정만으로 A/B 균형이 검증되지는 않습니다.</li><li>위험·건강·안전 관련 조건은 우선순위 판단을 탐색하며, 합의만으로 모든 위험을 허용한다는 뜻이 아닙니다.</li><li>응답자의 예상 손익·수정 가능성 등은 시나리오에 없는 사실을 응답자가 추정한 것입니다. 조사 결과에서는 사실과 구분합니다.</li></ul><h2>12문항의 이유 선택지</h2><div style=\"overflow:auto\"><table><thead><tr><th>문항·선택</th><th>수정된 이유</th><th>개념 참고</th></tr></thead><tbody><tr><td>Q1 A</td><td><ol><li>다른 팀의 정보까지 알아야 고객에게 가능한 답을 줄 수 있어서</li><li>팀마다 다른 약속을 하면 고객의 신뢰를 잃을 수 있어서</li><li>다른 팀의 일정과 자원까지 쓰는 결정은 함께 정해야 해서</li></ol></td><td>DR</td></tr><tr><td>Q1 B</td><td><ol><li>기다리는 동안 고객이 다른 대안을 선택할 수 있어서</li><li>고객 상황을 직접 아는 담당자의 판단이 더 정확할 수 있어서</li><li>먼저 대응해도 영향이 작고 필요하면 수정할 수 있다고 봐서</li></ol></td><td>DR</td></tr><tr><td>Q2 A</td><td><ol><li>승인을 기다리는 시간이 실행을 지연시키고 있어서</li><li>분야별로 필요한 정보와 전문성이 담당자에게 있어서</li><li>결정권과 실행 책임을 같은 사람에게 두고 싶어서</li></ol></td><td>DR</td></tr><tr><td>Q2 B</td><td><ol><li>한 팀의 결정이 다른 팀의 실행에 영향을 주기 때문에</li><li>팀별 성과보다 프로젝트 전체의 성과를 기준으로 판단해야 해서</li><li>비슷한 문제마다 다시 합의하는 시간을 줄이고 싶어서</li></ol></td><td>DR</td></tr><tr><td>Q3 A</td><td><ol><li>팀 간 자료와 업무를 주고받을 공통 기준이 필요해서</li><li>팀별 결과를 같은 기준으로 비교하고 개선하고 싶어서</li><li>나중에 시스템과 교육을 따로 운영하는 비용을 줄이고 싶어서</li></ol></td><td>DR, SDT</td></tr><tr><td>Q3 B</td><td><ol><li>업무 특성이 달라 같은 방식의 효과도 다를 수 있어서</li><li>여러 방식을 실제로 써보고 더 나은 방법을 찾고 싶어서</li><li>직접 고른 방식일수록 납득하고 실행하기 쉽다고 봐서</li></ol></td><td>DR, SDT</td></tr><tr><td>Q4 A</td><td><ol><li>실패 가능성을 고려해도 성공했을 때의 가치가 크다고 봐서</li><li>기존 방식의 개선만으로는 필요한 성장을 만들기 어렵다고 봐서</li><li>이번 시도로 얻을 기술과 지식이 다음 사업에도 쓰일 수 있어서</li></ol></td><td>EFF, DC</td></tr><tr><td>Q4 B</td><td><ol><li>이 과제가 실패해도 다른 중요한 과제는 계속할 수 있어야 해서</li><li>어디까지 손실을 감수할지 정해야 실행 중단도 결정할 수 있어서</li><li>작게 확인한 결과를 보고 투자를 늘리는 편이 낫다고 봐서</li></ol></td><td>EFF, DC</td></tr><tr><td>Q5 A</td><td><ol><li>구성원이 해낼 방법을 떠올릴 수 있어야 목표에 힘을 쏟는다고 봐서</li><li>목표에 맞춰 약속한 인력과 예산을 실제로 확보할 수 있어야 해서</li><li>달성 가능성을 무시하면 무리한 업무나 숫자 맞추기가 생길까 봐</li></ol></td><td>GOAL, JDR</td></tr><tr><td>Q5 B</td><td><ol><li>높은 목표가 기존 방법을 다시 살펴보게 한다고 봐서</li><li>어려워도 중요한 목표에 노력과 자원을 집중하고 싶어서</li><li>현재 수준의 개선만으로는 시장에서 필요한 수준에 못 미쳐서</li></ol></td><td>GOAL, JDR</td></tr><tr><td>Q6 A</td><td><ol><li>자료만 검토해서는 알 수 없고 직접 해봐야 알 수 있는 것이 있어서</li><li>투입을 작게 제한하면 배우면서 다음 투자를 결정할 수 있어서</li><li>확인을 기다리는 동안 먼저 움직일 기회를 놓칠 수 있어서</li></ol></td><td>EFF</td></tr><tr><td>Q6 B</td><td><ol><li>실행 전에 적은 비용으로 틀린 가설을 걸러낼 수 있다고 봐서</li><li>작은 시도라도 고객이나 다른 업무에 미칠 영향을 알아야 해서</li><li>이번 시도보다 더 가치 있는 일에 자원을 쓸 수도 있어서</li></ol></td><td>EFF</td></tr><tr><td>Q7 A</td><td><ol><li>반복 업무에 쓰는 시간을 줄여 다른 중요한 일에 쓰고 싶어서</li><li>누적된 부담으로 구성원이 지치거나 실수가 늘어날까 봐</li><li>내부 처리 과정이 좋아져야 고객 문제도 지속적으로 풀 수 있다고 봐서</li></ol></td><td>JDR, BSC</td></tr><tr><td>Q7 B</td><td><ol><li>고객의 불편을 더 미루면 이탈로 이어질 수 있어서</li><li>고객이 실제로 느끼는 개선을 우선 성과로 만들고 싶어서</li><li>이번 개선이 매출과 후속 사업에 더 큰 영향을 준다고 봐서</li></ol></td><td>JDR, BSC</td></tr><tr><td>Q8 A</td><td><ol><li>프로젝트의 가치를 고객이 얻은 변화로 확인하고 싶어서</li><li>내부에서 좋다는 평가보다 실제 사용과 구매 반응을 보고 싶어서</li><li>한정된 자원을 어떤 사업에 더 쓸지 판단하는 근거가 필요해서</li></ol></td><td>BSC</td></tr><tr><td>Q8 B</td><td><ol><li>이번에 쌓은 역량을 다음 프로젝트에서도 다시 쓸 수 있는지 보고 싶어서</li><li>팀이 직접 바꾼 일하는 방식과 과정을 평가하고 싶어서</li><li>시장 성과가 나오기 전에도 개선이 진행되는지 확인하고 싶어서</li></ol></td><td>BSC</td></tr><tr><td>Q9 A</td><td><ol><li>기존 역량에만 맞추면 중요한 고객 문제를 놓칠 수 있어서</li><li>새로운 문제를 풀며 앞으로 필요한 역량을 확보하고 싶어서</li><li>역량 확보 비용을 감수해도 고객 문제를 푸는 가치가 크다고 봐서</li></ol></td><td>EFF, DC</td></tr><tr><td>Q9 B</td><td><ol><li>이미 검증된 전문성과 경험을 활용하면 실행 불확실성이 줄어서</li><li>가진 자원으로 시작해야 추가 투입과 학습 부담을 줄일 수 있어서</li><li>새 분야에 자원을 나누면 기존 사업의 강점이 약해질 수 있어서</li></ol></td><td>EFF, DC</td></tr><tr><td>Q10 A</td><td><ol><li>지금 목표를 달성해도 필요한 사업 성과와 어긋날 수 있어서</li><li>달라진 기회에 맞춰 인력과 예산을 다시 배분하고 싶어서</li><li>유효하지 않은 목표를 계속 요구하면 현장이 잘못된 일에 집중할 수 있어서</li></ol></td><td>DC, GOAL</td></tr><tr><td>Q10 B</td><td><ol><li>상황 변화가 일시적인지 판단할 근거가 아직 부족해서</li><li>목표를 바꾸면 연계된 팀들의 일정과 약속도 흔들릴 수 있어서</li><li>평가 기준을 바꾸면 지금까지의 기여를 공정하게 인정하기 어려울 수 있어서</li></ol></td><td>DC, GOAL</td></tr><tr><td>Q11 A</td><td><ol><li>새 방법의 효과가 추가 일정과 비용을 상쇄할지 아직 불확실해서</li><li>이번 단계의 결과를 기다리는 고객이나 다른 팀의 일정이 있어서</li><li>현재 방법의 결과를 확인한 뒤 다음 단계에서 비교하고 싶어서</li></ol></td><td>DC, BSC</td></tr><tr><td>Q11 B</td><td><ol><li>추가 비용을 감수해도 결과의 개선 폭이 더 크다고 봐서</li><li>다음 단계까지 기다리면 수정해야 할 범위가 더 커질 수 있어서</li><li>남은 기간에 새 방법을 익혀 이후에도 활용하고 싶어서</li></ol></td><td>DC, BSC</td></tr><tr><td>Q12 A</td><td><ol><li>앞으로 얻을 결과보다 추가로 들일 비용이 더 크다고 봐서</li><li>남은 인력과 예산을 더 가능성 있는 일에 쓰고 싶어서</li><li>확인된 고객 반응에 맞춰 해결할 문제를 다시 정해야 해서</li></ol></td><td>DC, ESC</td></tr><tr><td>Q12 B</td><td><ol><li>약속을 중단할 때 생길 고객·협력사의 손실을 줄이고 싶어서</li><li>현재 범위를 끝내면 다른 용도로 쓸 수 있는 결과가 남는다고 봐서</li><li>지금까지 들인 시간과 노력을 여기서 포기하기 어려워서</li></ol></td><td>DC, ESC</td></tr></tbody></table></div><h2>분기별로 구별하려는 판단 근거</h2><ul><li>Q1: 정보 완전성·고객 약속·공동 자원 / 지연 손실·현장 정보·수정 가능성</li><li>Q2: 승인 지연·전문성·권한과 책임 / 상호 영향·전체 목표·조정 비용</li><li>Q3: 공통 기반·비교·운영 비용 / 상황 적합성·실험·자발적 수용</li><li>Q4: 기대 가치·성장 필요·지식 확보 / 자원 보전·중단 기준·단계 투자</li><li>Q5: 달성 경로·자원 확보·부담 / 전략 탐색·집중·시장 요구</li><li>Q6: 실험 정보·손실 제한·시점 / 사전 확인·영향 범위·기회비용</li><li>Q7: 시간 자원·소진 우려·내부 과정 / 이탈·고객 체감·사업 영향</li><li>Q8: 고객 결과·외부 확인·투자 배분 / 역량·과정·선행 지표</li><li>Q9: 고객 문제·새 역량·기대 가치 / 기존 전문성·가용 수단·집중</li><li>Q10: 목표 유효성·자원 재배분·행동 유도 / 변화 근거·상호 의존·평가 공정성</li><li>Q11: 효과 근거·일정 의존·비교 학습 / 순편익·수정 비용·학습</li><li>Q12: 앞으로의 비용·대안·문제 재정의 / 상대 손실·잔존 가치·과거 투입에 대한 미련</li></ul><h2>근거와 적용 범위</h2><p>표의 참고문헌은 개념적 배경입니다. 신뢰·공정성·기회비용 등 일부 선택지는 연구 개념과 업무 상황을 바탕으로 작성한 실무 가설이며, 해당 논문이 각 문장을 직접 검증했다는 뜻이 아닙니다.</p><ol><li><b>DR</b> — <a href=\"https://ucema.edu.ar/u/je49/organizacion/Jensen_SpecificK.pdf\" target=\"_blank\" rel=\"noopener\">Jensen &amp; Meckling (1992), Specific and General Knowledge, and Organizational Structure</a><p>의사결정에 필요한 정보의 위치, 결정권 배분, 조직 목표에 맞춘 통제. 정보·권한 이유의 개념 근거.</p></li><li><b>SDT</b> — <a href=\"https://selfdeterminationtheory.org/SDT/documents/2005_GagneDeci_JOB_SDTtheory.pdf\" target=\"_blank\" rel=\"noopener\">Gagné &amp; Deci (2005), Self-determination theory and work motivation</a><p>선택에 대한 자발적 수용과 자율적 동기. 자율성은 단독 결정권과 같은 개념이 아니다.</p></li><li><b>GOAL</b> — <a href=\"https://doi.org/10.1037/0003-066X.57.9.705\" target=\"_blank\" rel=\"noopener\">Locke &amp; Latham (2002), Building a Practically Useful Theory of Goal Setting and Task Motivation</a><p>목표의 도전성, 몰입, 자기효능감, 피드백과 과제 복잡성을 함께 고려. 높은 목표가 항상 더 낫다는 주장은 하지 않는다.</p></li><li><b>EFF</b> — <a href=\"https://doi.org/10.5465/amr.2001.4378020\" target=\"_blank\" rel=\"noopener\">Sarasvathy (2001), Causation and Effectuation</a><p>기대수익과 감당 가능한 손실의 구분, 가진 수단에서 출발하는 실행 논리. 기업가정신 맥락을 일반 업무의 선택지 설계에 응용했다.</p></li><li><b>JDR</b> — <a href=\"https://doi.org/10.1108/02683940710733115\" target=\"_blank\" rel=\"noopener\">Bakker &amp; Demerouti (2007), The Job Demands–Resources model: state of the art</a><p>직무 요구와 자원의 관점에서 부담·회복·지원 여건을 구별. 특정 기간의 업무가 안전하거나 유해하다고 단정하지 않는다.</p></li><li><b>BSC</b> — <a href=\"https://www.hbs.edu/ris/Publication%20Files/10-074_0bf3c151-f82b-4592-b885-cdde7f5d97a6.pdf\" target=\"_blank\" rel=\"noopener\">Kaplan (2010), Conceptual Foundations of the Balanced Scorecard</a><p>고객, 내부 과정, 학습·성장, 재무 성과를 구분. 한 지표만 쓰라는 이론이 아니며 Q8의 강제선택은 후킹을 위한 단순화다.</p></li><li><b>DC</b> — <a href=\"https://doi.org/10.1002/smj.640\" target=\"_blank\" rel=\"noopener\">Teece (2007), Explicating dynamic capabilities</a><p>기회 감지·포착·자원 재구성의 개념과 연결. 모든 환경 변화에서 즉시 목표를 바꾸라는 처방이 아니다. 공개 초록 범위에서 확인.</p></li><li><b>ESC</b> — <a href=\"https://doi.org/10.1016/0030-5073(76)90005-2\" target=\"_blank\" rel=\"noopener\">Staw (1976), Knee-deep in the big muddy</a><p>부정적 결과 이후에도 기존 행동에 자원을 더 투입하는 몰입 상승 연구. Q12B3·추가 딜레마의 투입 노력 이유는 정당화가 아니라 탐색용이며 단일 응답으로 편향을 진단하지 않는다. 공개 초록 범위에서 확인.</p></li></ol><h2>파일럿 확인</h2><p>서로 다른 직군·직급의 참여자가 선택지를 자기 말로 설명하게 하고, 중복·누락·선택지에 없는 가정을 확인하세요. 기타·건너뛰기 비율과 A/B별 이유 분포, 경계조건 응답 후 실제 선택 변경 여부를 검토하세요. 변화가 있었다고 말한 조건을 별도 상황으로 제시해야 경계의 작동을 더 직접 확인할 수 있습니다.</p><p>이 버전은 새 저장 키를 사용해 이전 문구로 수집한 응답과 구분합니다. 이전 브라우저 기록을 삭제하지 않습니다. 내보내기에 문항 버전을 포함합니다.</p>";
